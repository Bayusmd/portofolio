<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1c"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9a9aa2"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a50"/>
      <stop offset="1" stop-color="#1c1c1f"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="109" fill="none" stroke="url(#edge)" stroke-width="3"/>

  <g transform="translate(6,0)" fill="none" stroke-linejoin="round">
    <!-- B -->
    <path d="M215 156 H140 V356 H235 A50 50 0 0 0 235 256 H140 M140 256 H215 A50 50 0 0 0 215 156"
          stroke="url(#ink)" stroke-width="32" stroke-linecap="butt" stroke-linejoin="miter"/>

    <!-- S: dark outline first (creates the interlock gap), then the letter -->
    <g transform="translate(-22,0)">
      <path d="M381 177 A50 50 0 1 0 340 256 A50 50 0 1 1 299 335"
            stroke="#080808" stroke-width="48" stroke-linecap="round"/>
      <path d="M381 177 A50 50 0 1 0 340 256 A50 50 0 1 1 299 335"
            stroke="url(#ink)" stroke-width="32" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Accent dot -->
  <circle cx="392" cy="376" r="9" fill="#ffffff"/>
</svg>
